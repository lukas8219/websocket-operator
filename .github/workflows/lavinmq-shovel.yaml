name: LavinMQ HTTP shovel contract
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/test-lavinmq-shovel.py', '.github/workflows/lavinmq-shovel.yaml', 'docs/lavinmq-shovel.md']
permissions:
  contents: read
concurrency:
  group: lavinmq-shovel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned broker's HTTP mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/lavinmq-shovel
          curl -fsSL https://github.com/cloudamqp/lavinmq/releases/download/v2.11.1/lavinmq-2.11.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/lavinmq.tar.gz"
          echo "5a84fde689bda864bf27899155d102bb09b582dd6f2e6f5c517b044faf51286a  $RUNNER_TEMP/lavinmq.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lavinmq.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lavinmq-2.11.1-linux-amd64/lavinmq" -D "$RUNNER_TEMP/lavinmq-data" --mqtt-port=-1 --metrics-http-port=-1 > reports/lavinmq-shovel/broker.log 2>&1 &
          broker_pid=$!
          trap 'kill "$broker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do nc -z 127.0.0.1 15672 && break; sleep 0.2; done
          python3 scripts/test-lavinmq-shovel.py | tee reports/lavinmq-shovel/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavinmq-shovel-contract
          path: reports/lavinmq-shovel
          if-no-files-found: error
