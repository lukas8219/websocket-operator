name: System integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/system.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'integration_tests/**'
      - 'deployments/**'
      - 'scripts/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'
concurrency:
  group: system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  system:
    name: System (${{ matrix.install }}, ${{ matrix.header }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {install: manifests, header: ws-user-id}
          - {install: manifests, header: X-App-User}
          - {install: helm, header: X-App-User}
    env:
      WS_OPERATOR_USER_HEADER: ${{ matrix.header }}
      WS_E2E_INSTALL: ${{ matrix.install }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Validate chart
        run: helm lint charts/websocket-operator
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Test injection and routed messages
        run: bash scripts/ci-check.sh bash scripts/test-system.sh go test -tags=e2e -count=1 -timeout=5m -v ./integration_tests/system
