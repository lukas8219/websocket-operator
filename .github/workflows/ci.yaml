name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true # Let the action handle caching automatically

    - name: Run go mod tidy
      run: |
        go mod tidy -diff

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: make test

    - name: Run tests with race detector
      run: make test-race

    - name: Run vet
      run: go vet ./...

  build-loadbalancer:
    name: Build Loadbalancer Container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Loadbalancer Container
      run: make build-loadbalancer

  build-sidecar:
    name: Build Sidecar Container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Sidecar Container
      run: make build-sidecar

  build-controller:
    name: Build Controller Container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Controller Container
      run: make build-controller

