name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true # Let the action handle caching automatically

    - name: Run go mod tidy
      run: |
        bash scripts/ci-check.sh go mod tidy -diff

    - name: Verify dependencies
      run: bash scripts/ci-check.sh go mod verify

    - name: Build
      run: bash scripts/ci-check.sh go build -v ./...

    - name: Run tests
      run: bash scripts/ci-check.sh make test

    - name: Run tests with race detector
      run: bash scripts/ci-check.sh make test-race

    - name: Run vet
      run: bash scripts/ci-check.sh go vet ./...

  build-loadbalancer:
    name: Build Loadbalancer Container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Loadbalancer Container
      run: bash scripts/ci-check.sh make build-loadbalancer

  build-sidecar:
    name: Build Sidecar Container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Sidecar Container
      run: bash scripts/ci-check.sh make build-sidecar

  build-controller:
    name: Build Controller Container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Controller Container
      run: bash scripts/ci-check.sh make build-controller

